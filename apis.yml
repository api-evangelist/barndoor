aid: barndoor
url: https://raw.githubusercontent.com/api-evangelist/barndoor/refs/heads/main/apis.yml
name: Barndoor
kind: company
description: >-
  Barndoor AI is the control plane for agentic AI, providing secure access and governance for AI agents and Model
  Context Protocol (MCP) servers. Founded in 2024 by Oren Michels (founder of Mashery), Barndoor enables enterprise IT,
  security, and developer teams to register agents, govern MCP server access through policy, broker OAuth connections to
  backend SaaS, and proxy MCP traffic with runtime policy enforcement and full audit trails. The Barndoor Platform REST
  API manages servers, connections, policies, agents, and MCP / SSE request proxying. Python, TypeScript, and Go SDKs
  are published on GitHub alongside Rust SDKs (Cerbos, official MCP, MCP OAuth compliance suite) and a Crew AI example.
  Deployment options include SaaS (trial), private cloud, and on-premises (Enterprise).
