- aid: barndoor:mcp-auth-compliance
  name: MCP OAuth Compliance Suite
  description: >-
    Rust test suite that validates remote MCP servers against the MCP authorization specification - RFC
    9728 (Protected Resource Metadata), RFC 8414 (Authorization Server Metadata), RFC 7591 (Dynamic Client
