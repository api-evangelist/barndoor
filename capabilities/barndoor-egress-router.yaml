naftiko: "1.0.0-alpha2"

info:
  title: Barndoor Egress Router
  description: >-
    Routes Naftiko consume-side outbound calls through Barndoor's static
    egress IPs (5-IP shared pool) when the upstream API requires whitelisted
    source IPs at the destination. The Naftiko capability declares an upstream
    SaaS dependency; this capability handles the proxy hop so corporate
    firewalls and SaaS allow-lists work without per-customer egress
    infrastructure.
  tags:
    - Naftiko
    - Barndoor
    - Partnership
    - Egress
    - Networking
    - Whitelist
  created: '2026-05-15'
  modified: '2026-05-15'

binds:
  - namespace: barndoor-env
    description: Barndoor Platform credentials + egress proxy host.
    keys:
      BARNDOOR_TOKEN: BARNDOOR_TOKEN
      BARNDOOR_ORG: BARNDOOR_ORG

capability:
  consumes:
    - namespace: barndoor
      type: http
      baseUri: 'https://{{BARNDOOR_ORG}}.platform.barndoor.ai'
      authentication:
        type: bearer
        token: '{{BARNDOOR_TOKEN}}'
      resources:
        - name: egress-ips
          path: '/api/egress/ips'
          operations:
            - name: get-egress-ips
              method: GET
        - name: egress-proxy
          path: '/api/egress/proxy/{{server_id}}'
          operations:
            - name: get-proxy-endpoint
              method: GET
              inputParameters:
                - name: server_id
                  in: path
                  required: true
        - name: egress-usage
          path: '/api/egress/usage'
          operations:
            - name: get-egress-usage
              method: GET
              inputParameters:
                - name: since
                  in: query
                  type: string
                  required: false
                - name: server_id
                  in: query
                  type: string
                  required: false

  exposes:
    - type: rest
      address: 0.0.0.0
      port: 8080
      namespace: barndoor-egress-router-rest
      description: REST surface for the Barndoor egress IP routing layer.
      resources:
        - name: get-egress-ips
          path: '/egress/ips'
          operations:
            - name: get-egress-ips
              method: GET
              call: barndoor.get-egress-ips
        - name: get-proxy-endpoint
          path: '/egress/proxy/{server_id}'
          operations:
            - name: get-proxy-endpoint
              method: GET
              inputParameters:
                - name: server_id
                  in: path
                  type: string
                  required: true
              call: barndoor.get-proxy-endpoint
        - name: get-egress-usage
          path: '/egress/usage'
          operations:
            - name: get-egress-usage
              method: GET
              inputParameters:
                - name: since
                  in: query
                  type: string
                  required: false
                - name: server_id
                  in: query
                  type: string
                  required: false
              call: barndoor.get-egress-usage

    - type: mcp
      address: 0.0.0.0
      port: 3010
      namespace: barndoor-egress-router-mcp
      description: MCP server for SREs and platform agents to inspect Barndoor egress routing.
      tools:
        - name: get-egress-ips
          description: List the Barndoor static egress IPs to whitelist at upstream SaaS endpoints.
          hints:
            readOnly: true
          call: barndoor.get-egress-ips
        - name: get-proxy-endpoint
          description: Get the Barndoor proxy endpoint for a given upstream MCP server.
          hints:
            readOnly: true
          inputParameters:
            - name: server_id
              type: string
              required: true
              description: Barndoor MCP server UUID.
          call: barndoor.get-proxy-endpoint
        - name: get-egress-usage
          description: Get egress traffic usage broken down by upstream MCP server.
          hints:
            readOnly: true
          inputParameters:
            - name: since
              type: string
              required: false
              description: ISO 8601 timestamp lower bound.
            - name: server_id
              type: string
              required: false
              description: Filter to a specific Barndoor MCP server UUID.
          call: barndoor.get-egress-usage
