naftiko: "1.0.0-alpha2"

info:
  title: Barndoor Policy Violation Webhook
  description: >-
    Subscribes to Barndoor policy-violation events and bridges them into
    Naftiko's webhook-driven workflows — notify, escalate, throttle, or
    temporarily disable the offending capability. Closes the loop between
    "Barndoor saw a bad call" and "Naftiko can act on it" without writing
    custom event-bus glue per customer.
  tags:
    - Naftiko
    - Barndoor
    - Partnership
    - Webhooks
    - Policy
    - Events
    - Incident-Response
  created: '2026-05-15'
  modified: '2026-05-15'

binds:
  - namespace: barndoor-env
    description: Barndoor Platform credentials.
    keys:
      BARNDOOR_TOKEN: BARNDOOR_TOKEN
      BARNDOOR_ORG: BARNDOOR_ORG

capability:
  consumes:
    - namespace: barndoor
      type: http
      baseUri: 'https://{{BARNDOOR_ORG}}.platform.barndoor.ai'
      authentication:
        type: bearer
        token: '{{BARNDOOR_TOKEN}}'
      resources:
        - name: webhook-subscriptions
          path: '/api/webhooks/subscriptions'
          operations:
            - name: list-webhook-subscriptions
              method: GET
            - name: create-webhook-subscription
              method: POST
        - name: webhook-subscription
          path: '/api/webhooks/subscriptions/{{subscription_id}}'
          operations:
            - name: get-webhook-subscription
              method: GET
              inputParameters:
                - name: subscription_id
                  in: path
                  required: true
            - name: delete-webhook-subscription
              method: DELETE
              inputParameters:
                - name: subscription_id
                  in: path
                  required: true
        - name: violation-events
          path: '/api/violations'
          operations:
            - name: list-violations
              method: GET
              inputParameters:
                - name: since
                  in: query
                  type: string
                  required: false
                - name: agent_id
                  in: query
                  type: string
                  required: false
                - name: severity
                  in: query
                  type: string
                  required: false

  exposes:
    - type: rest
      address: 0.0.0.0
      port: 8080
      namespace: barndoor-policy-violation-webhook-rest
      description: REST surface for managing Barndoor policy-violation webhook subscriptions.
      resources:
        - name: webhook-subscriptions
          path: '/webhooks/subscriptions'
          operations:
            - name: list-webhook-subscriptions
              method: GET
              call: barndoor.list-webhook-subscriptions
            - name: create-webhook-subscription
              method: POST
              call: barndoor.create-webhook-subscription
        - name: webhook-subscription
          path: '/webhooks/subscriptions/{subscription_id}'
          operations:
            - name: get-webhook-subscription
              method: GET
              inputParameters:
                - name: subscription_id
                  in: path
                  type: string
                  required: true
              call: barndoor.get-webhook-subscription
            - name: delete-webhook-subscription
              method: DELETE
              inputParameters:
                - name: subscription_id
                  in: path
                  type: string
                  required: true
              call: barndoor.delete-webhook-subscription
        - name: list-violations
          path: '/violations'
          operations:
            - name: list-violations
              method: GET
              inputParameters:
                - name: since
                  in: query
                  type: string
                  required: false
                - name: agent_id
                  in: query
                  type: string
                  required: false
                - name: severity
                  in: query
                  type: string
                  required: false
              call: barndoor.list-violations

    - type: mcp
      address: 0.0.0.0
      port: 3010
      namespace: barndoor-policy-violation-webhook-mcp
      description: MCP server for incident-response agents to manage Barndoor violation webhooks.
      tools:
        - name: list-webhook-subscriptions
          description: List Barndoor webhook subscriptions for policy-violation events.
          hints:
            readOnly: true
          call: barndoor.list-webhook-subscriptions
        - name: create-webhook-subscription
          description: Create a new Barndoor webhook subscription for policy-violation events.
          hints:
            destructiveHint: false
          call: barndoor.create-webhook-subscription
        - name: get-webhook-subscription
          description: Get a single Barndoor webhook subscription by ID.
          hints:
            readOnly: true
          inputParameters:
            - name: subscription_id
              type: string
              required: true
              description: Barndoor webhook subscription UUID.
          call: barndoor.get-webhook-subscription
        - name: delete-webhook-subscription
          description: Delete a Barndoor webhook subscription.
          hints:
            destructiveHint: true
          inputParameters:
            - name: subscription_id
              type: string
              required: true
              description: Barndoor webhook subscription UUID.
          call: barndoor.delete-webhook-subscription
        - name: list-violations
          description: List recent Barndoor policy-violation events with optional filters.
          hints:
            readOnly: true
          inputParameters:
            - name: since
              type: string
              required: false
              description: ISO 8601 timestamp lower bound.
            - name: agent_id
              type: string
              required: false
              description: Filter to a specific Barndoor agent UUID.
            - name: severity
              type: string
              required: false
              description: Filter by severity (low / medium / high / critical).
          call: barndoor.list-violations
