naftiko: "1.0.0-alpha2"

info:
  title: Barndoor Audit Stream
  description: >-
    Bridges Barndoor's S3-compatible audit log export (gzipped JSON Lines)
    into Naftiko's OpenTelemetry pipeline so a single Datadog / New Relic /
    Prometheus dashboard shows Naftiko consume/expose telemetry alongside
    Barndoor's per-call policy decisions. Cross-system correlation in one
    view, without bolting on per-customer audit glue.
  tags:
    - Naftiko
    - Barndoor
    - Partnership
    - Audit
    - Observability
    - OpenTelemetry
  created: '2026-05-15'
  modified: '2026-05-15'

binds:
  - namespace: barndoor-env
    description: Barndoor Platform credentials.
    keys:
      BARNDOOR_TOKEN: BARNDOOR_TOKEN
      BARNDOOR_ORG: BARNDOOR_ORG

capability:
  consumes:
    - namespace: barndoor
      type: http
      baseUri: 'https://{{BARNDOOR_ORG}}.platform.barndoor.ai'
      authentication:
        type: bearer
        token: '{{BARNDOOR_TOKEN}}'
      resources:
        - name: audit-events
          path: '/api/audit/events'
          operations:
            - name: list-audit-events
              method: GET
              inputParameters:
                - name: since
                  in: query
                  type: string
                  required: false
                - name: agent_id
                  in: query
                  type: string
                  required: false
                - name: server_id
                  in: query
                  type: string
                  required: false
                - name: decision
                  in: query
                  type: string
                  required: false
                - name: limit
                  in: query
                  type: integer
                  required: false
        - name: audit-export
          path: '/api/audit/export'
          operations:
            - name: trigger-audit-export
              method: POST
            - name: get-audit-export-status
              method: GET

  exposes:
    - type: rest
      address: 0.0.0.0
      port: 8080
      namespace: barndoor-audit-stream-rest
      description: REST surface for Barndoor audit event polling and S3 export control.
      resources:
        - name: audit-events
          path: '/audit/events'
          operations:
            - name: list-audit-events
              method: GET
              inputParameters:
                - name: since
                  in: query
                  type: string
                  required: false
                - name: agent_id
                  in: query
                  type: string
                  required: false
                - name: server_id
                  in: query
                  type: string
                  required: false
                - name: decision
                  in: query
                  type: string
                  required: false
                - name: limit
                  in: query
                  type: integer
                  required: false
              call: barndoor.list-audit-events
        - name: trigger-audit-export
          path: '/audit/export'
          operations:
            - name: trigger-audit-export
              method: POST
              call: barndoor.trigger-audit-export
        - name: get-audit-export-status
          path: '/audit/export/status'
          operations:
            - name: get-audit-export-status
              method: GET
              call: barndoor.get-audit-export-status

    - type: mcp
      address: 0.0.0.0
      port: 3010
      namespace: barndoor-audit-stream-mcp
      description: MCP server for SOC / SRE agents to query Barndoor audit events.
      tools:
        - name: list-audit-events
          description: List Barndoor audit events with optional filters (since, agent_id, server_id, decision).
          hints:
            readOnly: true
          inputParameters:
            - name: since
              type: string
              required: false
              description: ISO 8601 timestamp lower bound.
            - name: agent_id
              type: string
              required: false
              description: Filter to a specific Barndoor agent UUID.
            - name: server_id
              type: string
              required: false
              description: Filter to a specific MCP server UUID.
            - name: decision
              type: string
              required: false
              description: Filter by policy decision (allow / deny).
            - name: limit
              type: integer
              required: false
              description: Max events to return.
          call: barndoor.list-audit-events
        - name: trigger-audit-export
          description: Trigger an immediate Barndoor audit export to S3-compatible storage.
          hints:
            destructiveHint: false
          call: barndoor.trigger-audit-export
        - name: get-audit-export-status
          description: Check the status of the current Barndoor audit export.
          hints:
            readOnly: true
          call: barndoor.get-audit-export-status
