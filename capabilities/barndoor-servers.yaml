naftiko: 1.0.0-alpha2
info:
  label: Barndoor Platform API — Servers
  description: 'Barndoor Platform API — Servers. 5 operations. Lead operation: Create MCP Server. Self-contained Naftiko capability
    covering one Barndoor business surface.'
  tags:
  - Barndoor
  - Servers
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    BARNDOOR_API_KEY: BARNDOOR_API_KEY
capability:
  consumes:
  - type: http
    namespace: barndoor-servers
    baseUri: https://{organization_id}.platform.barndoor.ai
    description: Barndoor Platform API — Servers business capability. Self-contained, no shared references.
    resources:
    - name: api-servers
      path: /api/servers
      operations:
      - name: createserver
        method: POST
        description: Create MCP Server
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: listservers
        method: GET
        description: List MCP Servers
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: page
          in: query
          type: integer
          description: Page number (1-based)
        - name: limit
          in: query
          type: integer
          description: Number of items per page (max 100)
        - name: search
          in: query
          type: string
          description: Search servers by name or slug
        - name: status
          in: query
          type: string
          description: Filter by server status
        - name: connection_status
          in: query
          type: string
          description: Filter by connection status. `not_connected` expands to pending, error, and available.
    - name: api-servers-server_id
      path: /api/servers/{server_id}
      operations:
      - name: deleteserver
        method: DELETE
        description: Delete MCP Server
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: server_id
          in: path
          type: string
          description: Server UUID
          required: true
      - name: getserver
        method: GET
        description: Get Server Details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: server_id
          in: path
          type: string
          description: Server UUID
          required: true
      - name: updateserver
        method: PUT
        description: Update MCP Server
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: server_id
          in: path
          type: string
          description: Server UUID
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.BARNDOOR_API_KEY}}'
  exposes:
  - type: rest
    namespace: barndoor-servers-rest
    port: 8080
    description: REST adapter for Barndoor Platform API — Servers. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/api/servers
      name: api-servers
      description: REST surface for api-servers.
      operations:
      - method: POST
        name: createserver
        description: Create MCP Server
        call: barndoor-servers.createserver
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: listservers
        description: List MCP Servers
        call: barndoor-servers.listservers
        with:
          page: rest.page
          limit: rest.limit
          search: rest.search
          status: rest.status
          connection_status: rest.connection_status
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/servers/{server-id}
      name: api-servers-server-id
      description: REST surface for api-servers-server_id.
      operations:
      - method: DELETE
        name: deleteserver
        description: Delete MCP Server
        call: barndoor-servers.deleteserver
        with:
          server_id: rest.server_id
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: getserver
        description: Get Server Details
        call: barndoor-servers.getserver
        with:
          server_id: rest.server_id
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: updateserver
        description: Update MCP Server
        call: barndoor-servers.updateserver
        with:
          server_id: rest.server_id
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: barndoor-servers-mcp
    port: 9090
    transport: http
    description: MCP adapter for Barndoor Platform API — Servers. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: create-mcp-server
      description: Create MCP Server
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: barndoor-servers.createserver
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: list-mcp-servers
      description: List MCP Servers
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: barndoor-servers.listservers
      with:
        page: tools.page
        limit: tools.limit
        search: tools.search
        status: tools.status
        connection_status: tools.connection_status
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-mcp-server
      description: Delete MCP Server
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: barndoor-servers.deleteserver
      with:
        server_id: tools.server_id
      outputParameters:
      - type: object
        mapping: $.
    - name: get-server-details
      description: Get Server Details
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: barndoor-servers.getserver
      with:
        server_id: tools.server_id
      outputParameters:
      - type: object
        mapping: $.
    - name: update-mcp-server
      description: Update MCP Server
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: barndoor-servers.updateserver
      with:
        server_id: tools.server_id
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
