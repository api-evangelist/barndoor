naftiko: "1.0.0-alpha2"

info:
  title: Barndoor Agent Registry
  description: >-
    Surfaces Barndoor's registered agents (internal + external) into a
    Naftiko Fleet so Backstage's NaftikoFabricExplorerPage gets a unified
    "Agents (via Barndoor)" view alongside Naftiko-built capabilities.
    Single pane of glass for "what's running" — the build-side and the
    govern-side of the AI integration stack in one view.
  tags:
    - Naftiko
    - Barndoor
    - Partnership
    - Agents
    - Discovery
    - Backstage
  created: '2026-05-15'
  modified: '2026-05-15'

binds:
  - namespace: barndoor-env
    description: Barndoor Platform credentials.
    keys:
      BARNDOOR_TOKEN: BARNDOOR_TOKEN
      BARNDOOR_ORG: BARNDOOR_ORG

capability:
  consumes:
    - namespace: barndoor
      type: http
      baseUri: 'https://{{BARNDOOR_ORG}}.platform.barndoor.ai'
      authentication:
        type: bearer
        token: '{{BARNDOOR_TOKEN}}'
      resources:
        - name: list-agents
          path: '/api/agents'
          operations:
            - name: list-agents
              method: GET
            - name: register-agent
              method: POST
        - name: agent
          path: '/api/agents/{{agent_id}}'
          operations:
            - name: get-agent
              method: GET
              inputParameters:
                - name: agent_id
                  in: path
                  required: true
            - name: unregister-agent
              method: DELETE
              inputParameters:
                - name: agent_id
                  in: path
                  required: true
        - name: agent-counts
          path: '/api/agents/counts'
          operations:
            - name: get-agent-counts
              method: GET

  exposes:
    - type: rest
      address: 0.0.0.0
      port: 8080
      namespace: barndoor-agent-registry-rest
      description: REST surface for the Barndoor agent registry, designed for Backstage discovery.
      resources:
        - name: agents
          path: '/agents'
          operations:
            - name: list-agents
              method: GET
              call: barndoor.list-agents
            - name: register-agent
              method: POST
              call: barndoor.register-agent
        - name: agent
          path: '/agents/{agent_id}'
          operations:
            - name: get-agent
              method: GET
              inputParameters:
                - name: agent_id
                  in: path
                  type: string
                  required: true
              call: barndoor.get-agent
            - name: unregister-agent
              method: DELETE
              inputParameters:
                - name: agent_id
                  in: path
                  type: string
                  required: true
              call: barndoor.unregister-agent
        - name: agent-counts
          path: '/agents/counts'
          operations:
            - name: get-agent-counts
              method: GET
              call: barndoor.get-agent-counts

    - type: mcp
      address: 0.0.0.0
      port: 3010
      namespace: barndoor-agent-registry-mcp
      description: MCP server exposing Barndoor agent registry to discovery agents.
      tools:
        - name: list-agents
          description: List all Barndoor-registered agents (internal + external).
          hints:
            readOnly: true
          call: barndoor.list-agents
        - name: register-agent
          description: Register a new agent with Barndoor.
          hints:
            destructiveHint: false
          call: barndoor.register-agent
        - name: get-agent
          description: Get a Barndoor-registered agent by ID.
          hints:
            readOnly: true
          inputParameters:
            - name: agent_id
              type: string
              required: true
              description: Barndoor agent UUID.
          call: barndoor.get-agent
        - name: unregister-agent
          description: Remove an agent from the Barndoor registry.
          hints:
            destructiveHint: true
          inputParameters:
            - name: agent_id
              type: string
              required: true
              description: Barndoor agent UUID.
          call: barndoor.unregister-agent
        - name: get-agent-counts
          description: Get aggregate counts of Barndoor-registered agents (internal + external).
          hints:
            readOnly: true
          call: barndoor.get-agent-counts
