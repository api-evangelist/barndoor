naftiko: 1.0.0-alpha2
info:
  label: Barndoor Platform API — Agents
  description: 'Barndoor Platform API — Agents. 5 operations. Lead operation: List Agents. Self-contained Naftiko capability
    covering one Barndoor business surface.'
  tags:
  - Barndoor
  - Agents
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    BARNDOOR_API_KEY: BARNDOOR_API_KEY
capability:
  consumes:
  - type: http
    namespace: barndoor-agents
    baseUri: https://{organization_id}.platform.barndoor.ai
    description: Barndoor Platform API — Agents business capability. Self-contained, no shared references.
    resources:
    - name: api-agents
      path: /api/agents
      operations:
      - name: listagents
        method: GET
        description: List Agents
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: search
          in: query
          type: string
          description: Search applications by name or description
        - name: agent_type
          in: query
          type: string
          description: Filter by agent type
        - name: page
          in: query
          type: integer
          description: Page number (1-based)
        - name: limit
          in: query
          type: integer
          description: Number of items per page (max 100)
      - name: registeragent
        method: POST
        description: Register Agent
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: api-agents-counts
      path: /api/agents/counts
      operations:
      - name: getagentcounts
        method: GET
        description: Get Agent Counts
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: api-agents-agent_id
      path: /api/agents/{agent_id}
      operations:
      - name: unregisteragent
        method: DELETE
        description: Unregister Agent
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: agent_id
          in: path
          type: string
          required: true
      - name: getagent
        method: GET
        description: Get Agent
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: agent_id
          in: path
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.BARNDOOR_API_KEY}}'
  exposes:
  - type: rest
    namespace: barndoor-agents-rest
    port: 8080
    description: REST adapter for Barndoor Platform API — Agents. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/api/agents
      name: api-agents
      description: REST surface for api-agents.
      operations:
      - method: GET
        name: listagents
        description: List Agents
        call: barndoor-agents.listagents
        with:
          search: rest.search
          agent_type: rest.agent_type
          page: rest.page
          limit: rest.limit
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: registeragent
        description: Register Agent
        call: barndoor-agents.registeragent
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/agents/counts
      name: api-agents-counts
      description: REST surface for api-agents-counts.
      operations:
      - method: GET
        name: getagentcounts
        description: Get Agent Counts
        call: barndoor-agents.getagentcounts
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/agents/{agent-id}
      name: api-agents-agent-id
      description: REST surface for api-agents-agent_id.
      operations:
      - method: DELETE
        name: unregisteragent
        description: Unregister Agent
        call: barndoor-agents.unregisteragent
        with:
          agent_id: rest.agent_id
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: getagent
        description: Get Agent
        call: barndoor-agents.getagent
        with:
          agent_id: rest.agent_id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: barndoor-agents-mcp
    port: 9090
    transport: http
    description: MCP adapter for Barndoor Platform API — Agents. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: list-agents
      description: List Agents
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: barndoor-agents.listagents
      with:
        search: tools.search
        agent_type: tools.agent_type
        page: tools.page
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
    - name: register-agent
      description: Register Agent
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: barndoor-agents.registeragent
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-agent-counts
      description: Get Agent Counts
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: barndoor-agents.getagentcounts
      outputParameters:
      - type: object
        mapping: $.
    - name: unregister-agent
      description: Unregister Agent
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: barndoor-agents.unregisteragent
      with:
        agent_id: tools.agent_id
      outputParameters:
      - type: object
        mapping: $.
    - name: get-agent
      description: Get Agent
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: barndoor-agents.getagent
      with:
        agent_id: tools.agent_id
      outputParameters:
      - type: object
        mapping: $.
